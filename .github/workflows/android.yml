# Builds the Beside Android app and checks the on-device engine against real models.
name: Android
on:
  workflow_dispatch:
  push:
    paths: [android/**, .github/workflows/android.yml]
jobs:
  engine:
    name: Engine with real models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: llama.cpp b11700
        run: git clone -q --depth 1 --branch b11700 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
      - name: Build engine test
        run: |
          cmake -S android/native-test -B /tmp/nt -DLLAMA_SRC=/tmp/llama.cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/nt -j4 --target beside-test
      - name: Qwen 3.5 0.8B
        run: |
          curl -sSL -o /tmp/m.gguf https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf
          /tmp/nt/beside-test /tmp/m.gguf
      - name: Gemma 4 E2B
        run: |
          curl -sSL -o /tmp/m.gguf https://huggingface.co/ggml-org/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_0.gguf
          /tmp/nt/beside-test /tmp/m.gguf
      - name: Qwen 3 4B Instruct
        run: |
          curl -sSL -o /tmp/m.gguf https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_0.gguf
          /tmp/nt/beside-test /tmp/m.gguf
      - name: Model files match the app catalog
        run: |
          python3 - <<'PY'
          import re, json, urllib.request
          src = open("android/app/src/main/java/app/beside/llm/Models.kt").read()
          found = re.findall(r'"([\w.-]+/[\w.-]+-GGUF)",\s*"([\w.-]+\.gguf)",\s*([\d_]+)', src)
          assert len(found) == 6, found
          bad = 0
          for repo, file, size in found:
              tree = json.load(urllib.request.urlopen(f"https://huggingface.co/api/models/{repo}/tree/main"))
              real = {t["path"]: t.get("size") for t in tree}
              ok = real.get(file) == int(size.replace("_", ""))
              bad += not ok
              print("OK " if ok else "BAD", repo, file, real.get(file))
          raise SystemExit(bad)
          PY

  voice:
    name: Kokoro voice archive
    runs-on: ubuntu-latest
    steps:
      - name: Archive layout and test sentences
        run: |
          curl -sSL -o k.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2
          stat -c %s k.tar.bz2
          tar xf k.tar.bz2 && ls -la kokoro-int8-multi-lang-v1_0
          pip install -q sherpa-onnx
          python3 - <<'PY'
          import sherpa_onnx, time, os
          d = "kokoro-int8-multi-lang-v1_0"
          model = f"{d}/model.int8.onnx" if os.path.exists(f"{d}/model.int8.onnx") else f"{d}/model.onnx"
          print("model file:", model)
          tts = sherpa_onnx.OfflineTts(sherpa_onnx.OfflineTtsConfig(model=sherpa_onnx.OfflineTtsModelConfig(
              kokoro=sherpa_onnx.OfflineTtsKokoroModelConfig(model=model, voices=f"{d}/voices.bin", tokens=f"{d}/tokens.txt",
                  data_dir=f"{d}/espeak-ng-data", lexicon=f"{d}/lexicon-us-en.txt"), num_threads=2)))
          for sid, speed in [(3, 1.0), (3, 1.3), (2, 1.0), (21, 1.0)]:
              t = time.time()
              a = tts.generate("That sounds like a heavy morning. Let's pick one tiny thing.", sid=sid, speed=speed)
              print(f"sid {sid} speed {speed}: {len(a.samples)/a.sample_rate:.2f}s audio in {time.time()-t:.2f}s")
          PY

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.31.0" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Unit tests and APK
        working-directory: android
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: beside-apk
          path: android/app/build/outputs/apk/release/*.apk
