# Builds the Beside Android app and checks the on-device engine against real models.
name: Android
on:
  workflow_dispatch:
  push:
    paths: [android/**, .github/workflows/android.yml]
jobs:
  engine:
    name: Engine with real models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: llama.cpp b11700
        run: git clone -q --depth 1 --branch b11700 https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
      - name: Build engine test
        run: |
          cmake -S android/native-test -B /tmp/nt -DLLAMA_SRC=/tmp/llama.cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/nt -j4 --target beside-test beside-format-test
      - name: Chat templates add each turn exactly once
        run: |
          T=/tmp/llama.cpp/models/templates
          /tmp/nt/beside-format-test $T/Qwen3.5-4B.jinja $T/Qwen-Qwen3-0.6B.jinja $T/google-gemma-4-31B-it.jinja $T/google-gemma-2-2b-it.jinja
      - name: Qwen 3.5 0.8B
        run: |
          curl -sSL --retry 5 --retry-all-errors -o /tmp/m.gguf https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf
          /tmp/nt/beside-test /tmp/m.gguf
      - name: Gemma 4 E2B
        run: |
          curl -sSL --retry 5 --retry-all-errors -o /tmp/m.gguf https://huggingface.co/ggml-org/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_0.gguf
          /tmp/nt/beside-test /tmp/m.gguf
      - name: Qwen 3 4B Instruct
        run: |
          curl -sSL --retry 5 --retry-all-errors -o /tmp/m.gguf https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_0.gguf
          /tmp/nt/beside-test /tmp/m.gguf
      - name: Model files match the app catalog
        run: |
          python3 - <<'PY'
          import re, json, urllib.request
          src = open("android/app/src/main/java/app/beside/llm/Models.kt").read()
          found = re.findall(r'"([\w.-]+/[\w.-]+-GGUF)",\s*"([\w.-]+\.gguf)",\s*([\d_]+)', src)
          assert len(found) == 6, found
          bad = 0
          for repo, file, size in found:
              tree = json.load(urllib.request.urlopen(f"https://huggingface.co/api/models/{repo}/tree/main"))
              real = {t["path"]: t.get("size") for t in tree}
              ok = real.get(file) == int(size.replace("_", ""))
              bad += not ok
              print("OK " if ok else "BAD", repo, file, real.get(file))
          raise SystemExit(bad)
          PY

  voice:
    name: Voice archives and speed
    runs-on: ubuntu-latest
    steps:
      - name: Download voices
        run: |
          for a in kokoro-int8-multi-lang-v1_0 kokoro-multi-lang-v1_0 kitten-nano-en-v0_8-int8 kitten-mini-en-v0_8; do
            curl -sSL --retry 5 --retry-all-errors https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$a.tar.bz2 | tar xj
          done
          ls -la kokoro-multi-lang-v1_0 kokoro-int8-multi-lang-v1_0 kitten-nano-en-v0_8-int8
          pip install -q sherpa-onnx
      - name: Real-time factor (lower is faster; above 1 cannot keep up)
        run: |
          python3 - <<'PY'
          import sherpa_onnx as so, time, os, glob
          text = "That sounds like a heavy morning. Let's pick one tiny thing, and do just that."
          def kokoro(d, model, threads):
              return so.OfflineTts(so.OfflineTtsConfig(model=so.OfflineTtsModelConfig(kokoro=so.OfflineTtsKokoroModelConfig(
                  model=f"{d}/{model}", voices=f"{d}/voices.bin", tokens=f"{d}/tokens.txt", data_dir=f"{d}/espeak-ng-data",
                  lexicon=f"{d}/lexicon-us-en.txt"), num_threads=threads)))
          def kitten(d, threads):
              model = sorted(glob.glob(f"{d}/*.onnx"))[0]
              return so.OfflineTts(so.OfflineTtsConfig(model=so.OfflineTtsModelConfig(kitten=so.OfflineTtsKittenModelConfig(
                  model=model, voices=f"{d}/voices.bin", tokens=f"{d}/tokens.txt", data_dir=f"{d}/espeak-ng-data"), num_threads=threads)))
          cases = [("kokoro int8", lambda t: kokoro("kokoro-int8-multi-lang-v1_0", "model.int8.onnx", t), 3),
                   ("kokoro fp32", lambda t: kokoro("kokoro-multi-lang-v1_0", "model.onnx", t), 3),
                   ("kitten nano int8", lambda t: kitten("kitten-nano-en-v0_8-int8", t), 0),
                   ("kitten mini", lambda t: kitten("kitten-mini-en-v0_8", t), 0)]
          for name, make, sid in cases:
              for threads in (2, 4):
                  try:
                      tts = make(threads)
                      tts.generate("Hi.", sid=sid, speed=1.0)
                      t = time.time(); a = tts.generate(text, sid=sid, speed=1.0); dt = time.time() - t
                      dur = len(a.samples) / a.sample_rate
                      print(f"{name:18s} threads {threads}: {dur:.2f}s audio in {dt:.2f}s  RTF {dt/dur:.2f}  speakers {tts.num_speakers}")
                  except Exception as e:
                      print(f"{name:18s} threads {threads}: FAILED {e}")
          PY

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Android NDK and CMake
        run: |
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.31.0" "platforms;android-36" "build-tools;36.0.0" > /dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Unit tests and APK
        working-directory: android
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: beside-apk
          path: android/app/build/outputs/apk/release/*.apk
