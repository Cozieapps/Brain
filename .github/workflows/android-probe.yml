# Reports which on-device model files exist upstream (names, sizes, voice speaker ids).
name: Android model probe
on:
  workflow_dispatch:
  push:
    branches: [claude/offline-adhd-chat-voice-izgddy]
    paths: [.github/workflows/android-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: GGUF files
        run: |
          for repo in unsloth/gemma-4-E4B-it-GGUF unsloth/gemma-4-E2B-it-GGUF ggml-org/gemma-4-E4B-it-GGUF ggml-org/gemma-4-E2B-it-GGUF \
                      unsloth/Qwen3.5-4B-GGUF unsloth/Qwen3.5-2B-GGUF unsloth/Qwen3.5-0.8B-GGUF bartowski/Qwen_Qwen3.5-4B-GGUF Qwen/Qwen3.5-4B-GGUF \
                      Qwen/Qwen3-4B-GGUF unsloth/Qwen3-4B-GGUF unsloth/Qwen3-4B-Instruct-2507-GGUF; do
            echo "== $repo"
            curl -s "https://huggingface.co/api/models/$repo/tree/main" | jq -r '.[]? | select(.path|endswith(".gguf")) | "\(.size)\t\(.path)"' | grep -Ei "q4_0|q4_k_m|iq4_nl|q4_k_xl" || echo "(none)"
          done
      - name: Kokoro release assets
        run: |
          curl -s https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/tts-models | jq -r '.assets[] | select(.name|test("kokoro|kitten|supertonic")) | "\(.size)\t\(.name)"'
      - name: Kokoro archive contents and speakers
        run: |
          curl -sSL -o k.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2
          tar xf k.tar.bz2
          ls -la kokoro-multi-lang-v1_0 | head -40
          du -sh kokoro-multi-lang-v1_0
          find kokoro-multi-lang-v1_0 -maxdepth 1 -name "*.txt" -o -maxdepth 1 -name "*.md" | head
          pip install -q onnx sherpa-onnx
          python - <<'PY'
          import onnx
          m = onnx.load("kokoro-multi-lang-v1_0/model.onnx", load_external_data=False)
          for p in m.metadata_props:
              print("META", p.key, "=", p.value[:2000])
          PY
          python - <<'PY'
          import sherpa_onnx, time
          d = "kokoro-multi-lang-v1_0"
          cfg = sherpa_onnx.OfflineTtsConfig(model=sherpa_onnx.OfflineTtsModelConfig(
              kokoro=sherpa_onnx.OfflineTtsKokoroModelConfig(model=f"{d}/model.onnx", voices=f"{d}/voices.bin",
                  tokens=f"{d}/tokens.txt", data_dir=f"{d}/espeak-ng-data", lexicon=f"{d}/lexicon-us-en.txt"),
              num_threads=2))
          tts = sherpa_onnx.OfflineTts(cfg)
          print("speakers", tts.num_speakers, "rate", tts.sample_rate)
          t = time.time(); a = tts.generate("Hi. Let's pick one small thing, and do just that.", sid=3, speed=1.0)
          print("seconds audio", len(a.samples)/a.sample_rate, "took", time.time()-t)
          PY
